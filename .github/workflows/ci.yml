name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build, verify signature and test
        run: make
      - name: Verify command and compatibility launcher
        run: |
          ./iphctl --help
          ./iphctl capabilities
          python3 iphone_mirror.py capabilities
